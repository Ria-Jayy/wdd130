<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapid Adventures for rafting reservations, general inquiries, and customer support.">
    <meta name="author" content="Gloria John">
    <title>Contact Us | Rapid Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/Logo.png" alt="Rapid Adventures Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <section class="contact-info">

            <h1>Contact Rapid Adventures</h1>

            <p><strong>13 Mambolo Street Wuse Zone 2:</strong><br>
                123 Main River Street<br>
                Abuja, Nigeria
            </p>

            <p><strong>Phone:</strong><br>
                +234 (070) 3778-9533
            </p>

            <p><strong>Email:</strong><br>
                info@rapidadventures.com
            </p>

        </section>

        <section class="contact-grid">

            <div class="map">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086853965031!2d-122.41941568468152!3d37.77492927975953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c5f0f5f5f%3A0x1234567890abcdef!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1234567890123"
                  loading="lazy" allowfullscreen="">
                </iframe>

            </div>

            <div class="contact-form">

                <form>

                    <fieldset>

                        <legend>Contact Us</legend>

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <p>Purpose of Message</p>

                        <label>
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="website">
                            Website Suggestion
                        </label>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6"></textarea>

                        <label class="checkbox">
                            <input type="checkbox" name="newsletter">
                            Please subscribe me to the monthly newsletter.
                        </label>

                        <button type="submit">Get in Touch!</button>

                    </fieldset>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>
                        <strong>John Smith</strong><br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Reservations Manager">
                    <figcaption>
                        <strong>Mary Johnson</strong><br>
                        Reservations Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Safety Instructor">
                    <figcaption>
                        <strong>David Brown</strong><br>
                        Safety Instructor
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy;2026 Rapid Adventures | Gloria John</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
