<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Rapid Adventures for rafting reservations, general inquiries, and customer support.">
    <meta name="author" content="Gloria John">

    <title>Contact Us | Rapid Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.png" alt="Rapid Adventures Logo">

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <section class="contact-info">

            <h1>Contact Rapid Adventures</h1>

            <p>
                <strong>13 Mambolo Street Wuse Zone 2:</strong><br>
                123 Main River Street<br>
                Abuja, Nigeria
            </p>

            <p>
                <strong>Phone:</strong><br>
                +234 (070) 3778-9533
            </p>

            <p>
                <strong>Email:</strong><br>
                info@rapidadventures.com
            </p>

        </section>

        <section class="contact-grid">

            <div class="map">

                <iframe src="https://www.google.com/maps?q=Abuja%2C%20Nigeria&output=embed" title="Map showing Abuja, Nigeria" loading="lazy" allowfullscreen>
                </iframe>

            </div>

            <div class="contact-form">

                <form action="#" method="post">

                    <fieldset>

                        <legend>Contact Us</legend>

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <p>Purpose of Message</p>

                        <label>
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="website">
                            Website Suggestion
                        </label>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6"></textarea>

                        <label class="checkbox">
                            <input type="checkbox" name="newsletter">
                            Please subscribe me to the monthly newsletter.
                        </label>

                        <button type="submit">Get in Touch!</button>

                    </fieldset>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>
                        <strong>John Smith</strong><br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Reservations Manager">
                    <figcaption>
                        <strong>Mary Johnson</strong><br>
                        Reservations Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Safety Instructor">
                    <figcaption>
                        <strong>David Brown</strong><br>
                        Safety Instructor
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Rapid Adventures | Gloria John</p>

        <nav class="socialmedia" aria-label="Social media links">

            <a href="https://facebook.com" aria-label="Facebook">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>

            <a href="https://linkedin.com" aria-label="LinkedIn">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>

            <a href="https://instagram.com" aria-label="Instagram">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>

        </nav>

    </footer>

</body>

</html>
